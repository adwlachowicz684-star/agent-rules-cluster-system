# 为什么需要：本仓库提供 SARIF 导出与「P0 退出码 1 可接 CI」，自己却没用上。
# 这条流水线让审查技能**自己成为自己的第一个用户**：
#   ① 每次改动跑 fixture 实测（规则失效/FP 误报会当场红）
#   ② 结果导出 SARIF 上传 Code Scanning（PR 里内联显示）
#   ③ 顺带跑引擎自检（路由用例 + 结构规范）
name: self-audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    runs-on: ubuntu-latest
    # 本 job 的所有 run 步骤都在 skill 目录下跑。
    #
    # 防复发：新增步骤时最容易漏写 working-directory —— 漏了之后报错是
    # 「python3: can't open file 'scripts/xxx.py'」，指向脚本本身，
    # 而真实原因是路径不对，排查方向会被带偏（2026-09 实测：SARIF 导出自检
    # / fixture 交叉审计 / 注释化测试 三个步骤因此连续红了 46 次，
    # 连带 Code Scanning 一直收不到新结果）。
    defaults:
      run:
        working-directory: _common/skills/code-audit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 规则注册表漂移检查
        working-directory: _common/skills/code-audit
        run: python3 scripts/rule-registry.py --check

      - name: fixture 实测（TP 必须命中 / FP 必须不命中）
        working-directory: _common/skills/code-audit
        run: python3 scripts/rule-registry.py --test

      - name: 扫描器自检（列表从注册表推导，新增语言包自动纳入）
        working-directory: _common/skills/code-audit
        run: |
          # 不要写死 for s in scan-ts scan-app ... —— 那是「名单漏一个就静默失效」：
          # 新增 Rust 语言包时 scan-rust.py 一条自检都没跑，流水线照样绿。
          #
          # 过滤规则曾写成 `^scan-[a-z]+\.py$`，于是 cocos-audit.py 被过滤掉——
          # 同一个坑第二次踩（它不在 SARIF 收集里，Cocos 规则从不进 Code Scanning）。
          # 改成「纯脚本名」的宽匹配：--scanners 正常输出只有文件名，
          # 告警行带「▲ / 空格」不会误入。
          python3 scripts/rule-registry.py --scanners | grep -E '^[a-z][a-z0-9-]*\.py$' > /tmp/scanners.txt
          cat /tmp/scanners.txt
          test -s /tmp/scanners.txt || { echo "扫描器列表为空"; exit 1; }
          # —— 交叉断言：从注册表推导只堵住了「名单漏写」，堵不住「注册表里没它的
          # 规则」。2026-09 的实际事故：registry.json 停在 93 条（只有 ts/app），
          # 五个语言扫描器的 58 条规则从未入表 → --scanners 只推导出 2 个 →
          # scan-rust.py 等 5 个的 --self-test 一条都没跑，流水线照样绿。
          # 防复发的正确做法不是换个推导源，而是让「两个清单必须一致」成为断言：
          # 磁盘上有 scan-*.py，就必须出现在 --scanners 的输出里。
          ls scripts/scan-*.py | xargs -n1 basename | sort > /tmp/scanners_disk.txt
          echo "磁盘上的扫描器："; cat /tmp/scanners_disk.txt
          MISSING=$(comm -23 /tmp/scanners_disk.txt <(sort /tmp/scanners.txt))
          if [ -n "$MISSING" ]; then
            echo "✗ 这些扫描器文件存在，但注册表里没有它的规则 → 跑 --sync"
            echo "$MISSING"
            exit 1
          fi
          echo "✓ 磁盘扫描器与注册表推导结果一致"
          while read -r s; do
            [ -z "$s" ] && continue
            echo "── $s"
            # 不能写 `... || echo "无自检"` —— 那会把**真的失败**也吞成提示，
            # 正是本仓库 H011（工具报 0 不等于没问题）在 CI 里的重演。
            # 先判断该脚本是否支持 --self-test：支持就必须通过，不支持才跳过。
            if grep -qE "self[-_]test" "scripts/$s"; then
              python3 "scripts/$s" --self-test
            else
              echo "  无 --self-test（由 fixture 覆盖）"
            fi
          done < /tmp/scanners.txt

      - name: 硬编码名单一致性（防「漏一个 → 静默少做」）
        working-directory: _common/skills/code-audit
        run: |
          python3 scripts/check-list-drift.py --self-test
          python3 scripts/check-list-drift.py
      - name: SARIF 导出自检（前缀映射 / 合并去重）
        working-directory: _common/skills/code-audit
        run: python3 scripts/sarif.py --self-test
      - name: fixture 交叉审计（「正确写法」示例本身不能有缺陷）
        working-directory: _common/skills/code-audit
        run: python3 scripts/rule-registry.py --cross
      - name: 注释化测试（整段注释后应零命中 → 规则没扫注释）
        working-directory: _common/skills/code-audit
        run: python3 scripts/rule-registry.py --comment-test
      - name: 引擎专项扫描器自检
        working-directory: _common/skills/code-audit
        run: |
          # 上一步的 `ls scripts/scan-*.py` 只匹配 scan- 前缀，
          # 匹配不到 cocos-audit.py —— 引擎专项扫描器的 --self-test
          # 一条都不会跑，流水线照样绿。这与上面注释里记录的 scan-rust 事故
          # 是同一个失效模式，只是换了个文件名前缀。
          #
          # 不放进上一步的清单是因为那条链路与 registry 交叉断言绑定：
          # 引擎专项规则目前不在 registry 里（extract() 不认它的规则结构），
          # 加进去会让差集断言直接红。引擎专项与 registry 的打通另做。
          ls scripts/*-audit.py 2>/dev/null | xargs -n1 basename 2>/dev/null > /tmp/engine_scanners.txt
          if [ ! -s /tmp/engine_scanners.txt ]; then
            echo "无引擎专项扫描器，跳过"
            exit 0
          fi
          echo "引擎专项扫描器："; cat /tmp/engine_scanners.txt
          while read -r s; do
            [ -z "$s" ] && continue
            echo "── $s"
            python3 "scripts/$s" --self-test
          done < /tmp/engine_scanners.txt

      - name: skill 结构检查
        working-directory: _common/skills/code-audit
        run: python3 scripts/check-skill.py

      - name: 扫自身并导出 SARIF（同样推导，不写死）
        working-directory: _common/skills/code-audit
        run: |
          mkdir -p sarif-out
          files=""
          while read -r s; do
            [ -z "$s" ] && continue
            out="sarif-out/${s%.py}.sarif"
            # 退出码 1 有两种含义：找到 P0/P1（正常，有输出），
            # 或「无可扫文件」（异常，无输出）。用文件是否生成来区分，
            # 不要一律 || true 吞掉——那正是 H011。
            python3 "scripts/$s" --src=. --sarif="$out" || true
            if [ -f "$out" ]; then
              files="$files $out"
            else
              echo "  $s：无 SARIF 输出（该语言无文件可扫，或扫描失败）"
            fi
          done < /tmp/scanners.txt
          echo "合并：$files"
          python3 scripts/sarif.py $files --root=. --out=all.sarif || true
          test -f all.sarif && echo "all.sarif 已生成（$(wc -c < all.sarif) 字节）"
        continue-on-error: true

      - name: 上传 SARIF 到 Code Scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: _common/skills/code-audit/all.sarif
          category: code-audit

  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 过闸逻辑自检（驳回清单 / 三件套 / 事实扫描）
        working-directory: self-evolving_skill_mechanism/skills
        run: python3 scripts/consolidate.py --self-test

      - name: 大类路由自检（keywords 退化会让归属静默失真）
        working-directory: self-evolving_skill_mechanism/skills
        run: python3 scripts/structure.py --self-test

      - name: 规范检查自检（检查项必须能红，不能永远绿）
        working-directory: self-evolving_skill_mechanism/skills
        run: python3 scripts/lint.py --self-test

      - name: 规范检查（死链 / 重复副本 / 标注退化 / 孤立知识点）
        working-directory: self-evolving_skill_mechanism/skills
        run: |
          python3 scripts/domain.py --init
          python3 scripts/lint.py

      - name: 配置解析自检
        working-directory: self-evolving_skill_mechanism/skills
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'scripts')
          from pathlib import Path
          from domain import load_config
          cfg = load_config(Path('config.yaml'))
          for k, m in cfg['domains'].items():
              assert isinstance(m.get('keywords'), list), k
          print('配置解析正常：%d 个大类的 keywords 均为列表' % len(cfg['domains']))
          PY
